# Backend della piattaforma, avviabile con un solo comando:
#
#   export HARNESS_SIGNING_KEK=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
#   docker compose -f deploy/docker-compose.yml up --build
#
# (vedi anche deploy/.env.example, caricabile con `docker compose --env-file`)
#
# Porta su: Postgres + control plane (con UI su http://localhost:8787).
# Al primo avvio il control plane si auto-seeda (admin + token di enrollment +
# token gateway): le credenziali finiscono SOLO nel volume condiviso
# (/shared/seed.json, 0600), mai su stdout — quindi mai in `docker logs`.
# Recuperale con: docker compose exec control-plane cat /shared/seed.json
#
# Il gateway LLM è opzionale (richiede una chiave provider) e si abilita col
# profilo `gateway`:
#
#   ANTHROPIC_API_KEY=sk-... docker compose -f deploy/docker-compose.yml --profile gateway up --build
#
# HARNESS_SIGNING_KEK è obbligatoria (32 byte, base64 o hex) e non ha un
# default committato: senza, il control plane rifiuta l'avvio in modalità
# Postgres piuttosto che scrivere le chiavi di firma in chiaro nel database.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: "postgresql://harness:harness@postgres:5432/harness"
      # Obbligatoria: nessun default committato (vedi deploy/.env.example).
      HARNESS_SIGNING_KEK: "${HARNESS_SIGNING_KEK:?imposta HARNESS_SIGNING_KEK (32 byte base64/hex) — vedi deploy/.env.example}"
      HARNESS_LOG_LEVEL: "info"
    volumes:
      - cp-data:/data
      - seed:/shared
    depends_on:
      postgres:
        condition: service_healthy
    # Seeding idempotente (credenziali scritte solo su file, mai su stdout/log)
    # poi avvio del server.
    command:
      - sh
      - -c
      - >-
        node packages/control-plane/dist/cli.js seed --data-dir /data --out /shared/seed.json &&
        exec node packages/control-plane/dist/cli.js serve --data-dir /data --port 8787
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  llm-gateway:
    profiles: ["gateway"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "8788:8788"
    environment:
      PORT: "8788"
      CONTROL_PLANE_URL: "http://control-plane:8787"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      RATE_LIMIT_PER_MINUTE: "60"
    volumes:
      - seed:/shared
    depends_on:
      control-plane:
        condition: service_healthy
    # Legge il token gateway dal seed condiviso (o da GATEWAY_TOKEN se già noto).
    command:
      - sh
      - -c
      - >-
        export GATEWAY_TOKEN="${GATEWAY_TOKEN:-$(node -e "process.stdout.write(require('/shared/seed.json').gatewayToken)")}" &&
        exec node packages/llm-gateway/dist/cli.js
    restart: unless-stopped

volumes:
  cp-data:
  pg-data:
  seed:
