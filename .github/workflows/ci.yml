name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Abilita il test live dell'adapter Postgres (altrimenti si auto-salta).
      HARNESS_TEST_PG_URL: postgresql://harness:harness@localhost:5432/harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installa dipendenze (senza lifecycle script)
        run: npm ci --ignore-scripts
      - name: Installa Chromium per il test UI (playwright-core)
        run: |
          npx --yes playwright-core install --with-deps chromium
          echo "HARNESS_TEST_CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Lint (Biome)
        run: npm run lint
      - name: Test (incluso adapter Postgres, mTLS e UI browser)
        run: npm test
      - name: Coverage aggregata (soglia alta complessiva)
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-lines=85 --test-coverage-functions=85 --test-coverage-branches=75
          packages/*/dist/test/*.test.js
      - name: Coverage per-pacchetto (floor anti-regressione)
        # In aggiunta alla soglia aggregata: quella globale nasconde i pacchetti
        # più piccoli e meno coperti dietro shared/control-plane. Questi floor
        # per-pacchetto sono volutamente conservativi (riflettono la copertura
        # attuale con un margine) — non aspirazionali: servono a impedire che un
        # singolo pacchetto scivoli verso zero senza far scattare la CI. Vanno
        # alzati man mano che la copertura di quei pacchetti migliora.
        run: |
          set -e
          for pkg in shared enforcement-core control-plane llm-gateway agent-client fleet-extension; do
            tests=$(ls packages/$pkg/dist/test/*.test.js 2>/dev/null || true)
            if [ -z "$tests" ]; then echo "· $pkg: nessun test, salto"; continue; fi
            echo "▶ coverage floor $pkg"
            node --test --experimental-test-coverage \
              --test-coverage-lines=45 --test-coverage-functions=45 --test-coverage-branches=55 \
              $tests
          done
      - name: Load-test (regressione dell'indice O(1) token→device)
        run: node scripts/load-test.mjs --devices 500
      - name: Esempio end-to-end senza PI (dimostra il disaccoppiamento dell'enforcement)
        run: node examples/mock-agent/run.mjs
      - name: Valida deploy/docker-compose.yml
        run: |
          export HARNESS_SIGNING_KEK=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          docker compose -f deploy/docker-compose.yml config > /dev/null
      - name: Build immagine Docker del control plane
        run: docker build -f deploy/Dockerfile.backend -t harness-backend:ci .
      - name: Build immagine Docker del client gestito
        run: docker build -f deploy/Dockerfile.agent -t harness-agent:ci .
      - name: Audit dipendenze di produzione (gate reale su severità alta/critica)
        # Gate vero, non informativo: una CVE alta/critica in una dipendenza di
        # produzione rompe la build (le dipendenze runtime sono minime — solo pg).
        run: npm audit --omit=dev --audit-level=high
      - name: Verifica firme dei pacchetti (supply chain, gate reale)
        run: npm audit signatures
